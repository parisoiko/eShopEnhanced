name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore eShopEnhanced.slnx

      - name: Build
        run: dotnet build eShopEnhanced.slnx --no-restore -c Release

      # Unit tests + integration tests (in-memory SQLite, so no SQL Server is needed)
      - name: Test
        run: dotnet test eShopEnhanced.slnx --no-build -c Release --verbosity normal
